# MySQL configuration for production or local MySQL development.
# Create the database manually in MySQL Workbench or with:
# CREATE DATABASE wedding_planning_db;
#
# Then run the application with:
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# or
# java -jar target/*.jar --spring.profiles.active=mysql
#
# Local credentials are expected from environment variables.
# Example:
# export DB_USERNAME=root
# export DB_PASSWORD=your_pas
#
# If you prefer a different username or password, update the values in this profile.

spring.datasource.url=jdbc:mysql://localhost:3306/wedding_planning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

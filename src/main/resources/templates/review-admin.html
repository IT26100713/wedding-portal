<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" th:href="@{/review/css/wedding-bootstrap.css}">
  <title>Review management</title>
</head>
<body data-page="admin">
<nav th:replace="~{fragments/review-nav :: nav('admin')}"></nav>
<main class="container py-4 py-md-5">
  <div id="pageAlert"></div>
  <section class="page-hero p-4 p-md-5 mb-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h1 class="display-5 mb-1">Review management</h1>
      <p class="text-secondary fs-5 mb-0"><span id="countText">Loading...</span></p>
    </div>
    
  </section>

  <form class="card border-0 mb-4" id="filters">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-sm-6 col-lg-3">
          <label for="status" class="form-label fw-semibold">Status</label>
          <select class="form-select" id="status" name="status">
            <option value="">All</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="HIDDEN">Hidden</option>
          </select>
        </div>
        <div class="col-sm-6 col-lg-3">
          <label for="rating" class="form-label fw-semibold">Rating</label>
          <select class="form-select" id="rating" name="rating">
            <option value="">Any</option>
            <option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 stars</option>
          </select>
        </div>
        <div class="col-sm-6 col-lg-3">
          <label for="packageId" class="form-label fw-semibold">Package ID</label>
          <input type="number" class="form-control" id="packageId" name="packageId" min="1" placeholder="e.g. 2">
        </div>
        <div class="col-sm-6 col-lg-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Filter</button>
          <button type="button" class="btn btn-outline-secondary" id="clearFilters">Clear</button>
        </div>
      </div>
    </div>
  </form>

  <div class="card border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Package</th><th>Rating</th><th>Review</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="reviewRows"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="confirmDelete" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-4" id="confirmDeleteLabel">Delete this review?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">This cannot be undone.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="demoToast" class="toast text-bg-dark" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="demoToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/review/js/wedding-demo.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/event/css/event-style.css}">
</head>
<body class="error-page">
    <main class="error-card">
        <p class="eyebrow">Something went wrong</p>
        <h1 th:text="${errorCode != null ? 'Error ' + errorCode : 'Error'}">Error</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'We could not complete your request.'}">We could not complete your request.</p>
        <a class="btn btn-primary" th:href="@{/events/dashboard}">Return to dashboard</a>
    </main>
</body>
</html>

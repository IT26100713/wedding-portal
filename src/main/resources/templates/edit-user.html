<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}"><style>.edit-card{border:1px solid #eddcd6;border-radius:22px}.brand-title{font-family:'Playfair Display',serif;color:#654450}.btn-save{background:#a95e65;color:white;border-radius:30px}</style>
</head>
<body class="py-5">

<div class="container" style="max-width: 550px;">
    <div class="card edit-card p-4">
        <div class="text-center pt-2 mb-3">
            <i class="fa-solid fa-user-pen text-warning fs-2 mb-2"></i>
            <h3 class="brand-title">Edit User Details</h3>
            <p class="text-muted small">Update profile information for <span class="fw-bold" th:text="${user.fullName}">User</span></p>
        </div>

        <div class="card-body">
            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>

            <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" th:object="${updateDto}" method="post">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Phone Number</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+1 234 567 890" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">New Password <span class="text-muted fw-normal">(leave blank to keep current)</span></label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-save w-100 shadow-sm">
                        <i class="fa-solid fa-check me-1"></i> Save Changes
                    </button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary w-100 rounded-pill py-2 text-decoration-none text-center">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/wedding.css}" href="/css/wedding.css" rel="stylesheet">
    <title>My Bookings</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/bookings/new}">Wedding Portal</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/bookings/new}">Book a Wedding</a>
                <a class="nav-link" th:href="@{/bookings/my}">My Bookings</a>
                <a class="nav-link" th:href="@{/bookings/admin}">All Bookings</a>
            </div>
        </div>
    </nav>
<main class="container" style="max-width: 900px">
    <h1 class="h3 mb-3">My bookings</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/bookings/my}" class="row g-2 mb-4">
        <div class="col-auto">
            <input class="form-control" name="phone" th:value="${phone}" placeholder="Your phone number" required>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Find my bookings</button>
        </div>
    </form>

    <th:block th:if="${bookings != null}">
        <div class="alert alert-info" th:if="${#lists.isEmpty(bookings)}">
            No bookings found for this phone number. <a th:href="@{/bookings/new}">Book your wedding</a>
        </div>

        <div class="card shadow-sm mb-3" th:each="b : ${bookings}">
            <div class="card-body">
                <div class="d-flex justify-content-between flex-wrap gap-2">
                    <div>
                        <h2 class="h5 mb-1" th:text="${b.couple.brideName} + ' & ' + ${b.couple.groomName}"></h2>
                        <div class="text-muted small"
                             th:text="'Booking ' + ${b.id} + ' · ' + ${b.eventDate} + ' · ' + ${b.guestCount ?: 0} + ' guests'"></div>
                    </div>
                    <span class="badge align-self-start" th:classappend="${b.status == 'Confirmed'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${b.status}"></span>
                </div>
                <ul class="list-unstyled my-3">
                    <li>Photographer: <strong th:text="${b.photographer} ?: 'Not needed'"></strong></li>
                    <li>Caterer: <strong th:text="${b.caterer} ?: 'Not needed'"></strong></li>
                    <li>Decorator: <strong th:text="${b.decorator} ?: 'Not needed'"></strong></li>
                </ul>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div class="fs-5">Total: Rs. <span th:text="${#numbers.formatDecimal(totals[b.id], 1, 'COMMA', 2, 'POINT')}"></span></div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/bookings/{id}/edit(id=${b.id}, phone=${phone})}">Update</a>
                        <form method="post" th:action="@{/bookings/{id}/cancel(id=${b.id}, phone=${phone})}"
                              onsubmit="return confirm('Cancel this booking? It will be deleted.');">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</main>
</body>
</html>

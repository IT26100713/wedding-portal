<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookings</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; margin: 24px; color: #222; background: #fafafa; }
        table { border-collapse: collapse; width: 100%; background: #fff; font-size: 14px; }
        th, td { border-bottom: 1px solid #e3e3e3; padding: 8px; text-align: left; }
        th { background: #f1f1f1; }
        .message { color: #1b7f3b; font-weight: bold; }
        .error { color: #b00020; font-weight: bold; }
        .cancelled { color: #999; }
        a.button, button { display: inline-block; padding: 6px 12px; font-size: 14px; border: 1px solid #aaa;
                           border-radius: 4px; background: #f4f4f4; color: #222; text-decoration: none; cursor: pointer; }
        form.inline { display: inline; }
    </style>
</head>
<body>
<h1>Wedding Bookings</h1>

<p class="message" th:if="${message}" th:text="${message}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<p><a class="button" th:href="@{/bookings/new}">+ Create Booking</a></p>

<p th:if="${#lists.isEmpty(bookings)}">No bookings found.</p>

<table th:unless="${#lists.isEmpty(bookings)}">
    <thead>
    <tr>
        <th>ID</th><th>Bride</th><th>Groom</th><th>Phone</th><th>Photographer</th>
        <th>Caterer</th><th>Decorator</th><th>Event Date</th><th>Status</th><th>Total (Rs.)</th><th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="b : ${bookings}" th:classappend="${b.cancelled} ? 'cancelled'">
        <td th:text="${b.id}"></td>
        <td th:text="${b.couple.brideName}"></td>
        <td th:text="${b.couple.groomName}"></td>
        <td th:text="${b.couple.phone}"></td>
        <td th:text="${b.photographer} ?: 'Not selected'"></td>
        <td th:text="${b.caterer} ?: 'Not selected'"></td>
        <td th:text="${b.decorator} ?: 'Not selected'"></td>
        <td th:text="${b.eventDate}"></td>
        <td th:text="${b.status}"></td>
        <td th:text="${#numbers.formatDecimal(totals[b.id], 1, 'COMMA', 2, 'POINT')}"></td>
        <td>
            <th:block th:unless="${b.cancelled}">
                <a class="button" th:href="@{/bookings/{id}/edit(id=${b.id})}">Update</a>
                <form class="inline" method="post" th:action="@{/bookings/{id}/cancel(id=${b.id})}"
                      onsubmit="return confirm('Cancel this booking? It will be deleted from the database.');">
                    <button type="submit">Cancel</button>
                </form>
            </th:block>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

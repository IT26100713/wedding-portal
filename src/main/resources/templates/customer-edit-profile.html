
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Wedding Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #d7b46a;
            --gold-light: #f0d9a6;
            --white: #fffaf1;
            --muted: #d6c9b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #080807;
            color: var(--white);
            min-height: 100vh;
        }

        /* WEDDING BACKGROUND */

        .edit-page {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
            isolation: isolate;
        }

        .edit-page::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;

            background-image:
                url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;
            background-position: center;

            animation: backgroundZoom 18s ease-in-out infinite alternate;
        }

        .edit-page::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;

            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.68),
                rgba(0,0,0,0.55) 45%,
                rgba(0,0,0,0.86)
            );
        }

        @keyframes backgroundZoom {
            from {
                transform: scale(1.03);
            }

            to {
                transform: scale(1.12);
            }
        }

        /* GOLD DECORATIVE CORNERS */

        .corner {
            position: fixed;
            width: 65px;
            height: 35px;
            pointer-events: none;
        }

        .corner-left {
            top: 20px;
            left: 30px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-right {
            top: 20px;
            right: 30px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        .corner-bottom-left {
            bottom: 20px;
            left: 30px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-bottom-right {
            bottom: 20px;
            right: 30px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        /* MAIN CONTENT */

        .edit-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 620px;
            text-align: center;
            animation: fadeUp 0.9s ease both;
        }

        .brand-small {
            color: var(--gold);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gold-line {
            width: 65px;
            height: 1px;
            background: var(--gold);
            margin: 12px auto 15px;
        }

        /* PAGE HEADING */

        .main-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(35px, 4vw, 49px);
            font-weight: 400;
            line-height: 1.12;
            color: var(--white);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .subtitle {
            color: #e4d9cc;
            font-size: 12px;
            font-weight: 300;
            line-height: 1.7;
            max-width: 460px;
            margin: 0 auto 20px;
        }

        /* GLASS EDIT CARD */

        .edit-card {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;

            background: rgba(8,8,8,0.65);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(215,180,106,0.6);
            box-shadow: 0 20px 65px rgba(0,0,0,0.4);

            padding: 25px 32px;
            text-align: left;
        }

        /* CARD HEADING */

        .card-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(215,180,106,0.10);
            border: 1px solid var(--gold);
            border-radius: 50%;

            color: var(--gold);
            font-size: 23px;
        }

        .edit-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 400;
            color: white;
            margin-bottom: 6px;
        }

        .card-description {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 22px;
        }

        /* FORM GRID */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 17px 18px;
        }

        .form-group {
            min-width: 0;
        }

        .form-label {
            display: block;
            color: #e6dac8;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .optional-text {
            display: block;
            color: #b9ad9e;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0;
            text-transform: none;
            margin-top: 3px;
        }

        /* INPUT DESIGN */

        .form-control {
            width: 100%;
            height: 43px;
            padding: 10px 13px;

            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(215,180,106,0.45);
            border-radius: 0;

            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;

            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #b8ada2;
            opacity: 1;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.11);
            color: white;
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 2px rgba(215,180,106,0.15);
        }

        /* DIVIDER */

        .form-divider {
            height: 1px;
            background: rgba(215,180,106,0.28);
            margin: 24px 0 20px;
        }

        /* BUTTONS */

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        /* ORIGINAL SAVE BUTTON */

        .btn-save {
            flex: 1;
            padding: 12px 16px;

            background: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 0;

            color: #17120b;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;

            cursor: pointer;
            transition: 0.35s ease;
        }

        .btn-save:hover {
            background: transparent;
            color: var(--gold-light);
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* ORIGINAL CANCEL BUTTON */

        .btn-cancel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px 16px;

            background: transparent;
            border: 1px solid rgba(215,180,106,0.65);
            border-radius: 0;

            color: var(--gold-light);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;

            transition: 0.35s ease;
        }

        .btn-cancel:hover {
            background: rgba(215,180,106,0.13);
            border-color: var(--gold);
            color: white;
        }

        /* ERROR MESSAGE */

        .alert-danger {
            border-radius: 0;
            padding: 10px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 18px;
        }

        /* ANIMATION */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NORMAL LAPTOP SIZE */

        @media (min-width: 769px) and (max-height: 900px) {

            .edit-page {
                padding: 18px 20px;
            }

            .main-heading {
                font-size: 43px;
                margin-bottom: 8px;
            }

            .gold-line {
                margin: 10px auto 12px;
            }

            .subtitle {
                margin-bottom: 15px;
            }

            .edit-card {
                padding: 20px 28px;
            }

            .card-icon {
                width: 48px;
                height: 48px;
                font-size: 19px;
                margin-bottom: 8px;
            }

            .edit-title {
                font-size: 23px;
            }

            .card-description {
                margin-bottom: 17px;
            }

            .form-grid {
                gap: 13px 16px;
            }

            .form-divider {
                margin: 18px 0 16px;
            }
        }

        /* SHORT LAPTOP SCREEN */

        @media (min-width: 769px) and (max-height: 650px) {

            .edit-page {
                padding: 12px 20px;
            }

            .main-heading {
                font-size: 34px;
            }

            .subtitle {
                margin-bottom: 10px;
            }

            .edit-card {
                padding: 14px 25px;
            }

            .card-icon {
                display: none;
            }

            .card-description {
                margin-bottom: 10px;
            }

            .form-grid {
                gap: 10px 15px;
            }
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            .edit-page {
                padding: 65px 18px;
            }

            .edit-content {
                max-width: 460px;
            }

            .main-heading {
                font-size: clamp(34px, 9vw, 45px);
            }

            .edit-card {
                padding: 24px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .action-buttons {
                gap: 10px;
            }

            .btn-save,
            .btn-cancel {
                padding: 12px 10px;
                font-size: 11px;
            }

            .corner {
                width: 35px;
                height: 25px;
            }

            .corner-left,
            .corner-bottom-left {
                left: 14px;
            }

            .corner-right,
            .corner-bottom-right {
                right: 14px;
            }

            .corner-left,
            .corner-right {
                top: 14px;
            }

            .corner-bottom-left,
            .corner-bottom-right {
                bottom: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .edit-page::before,
            .edit-content {
                animation: none;
            }

            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

<section class="edit-page">

    <!-- GOLD DECORATIVE CORNERS -->

    <span class="corner corner-left"></span>
    <span class="corner corner-right"></span>
    <span class="corner corner-bottom-left"></span>
    <span class="corner corner-bottom-right"></span>

    <!-- PAGE CONTENT -->

    <div class="edit-content">

        <div class="brand-small">
            Wedding Reservation Portal
        </div>

        <div class="gold-line"></div>

        <h1 class="main-heading">
            Edit Your Profile
        </h1>

        <p class="subtitle">
            Keep your personal details up to date
            as you plan your perfect celebration.
        </p>

        <!-- EDIT CARD -->

        <div class="edit-card">

            <div class="card-icon">
                <i class="fa-solid fa-user-pen"></i>
            </div>

            <h2 class="edit-title">
                Account Information
            </h2>

            <p class="card-description">
                Update your account information below
            </p>

            <!-- ORIGINAL ERROR MESSAGE -->

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}"
                 role="alert">
            </div>

            <!-- ORIGINAL SPRING BOOT FORM -->

            <form th:action="@{/customer/profile/edit}"
                  th:object="${updateDto}"
                  method="post">

                <div class="form-grid">

                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName" class="form-label">
                            Full Name
                        </label>

                        <input
                                type="text"
                                id="fullName"
                                th:field="*{fullName}"
                                class="form-control"
                                placeholder="John Doe"
                                autocomplete="name"
                                required>

                    </div>

                    <!-- EMAIL ADDRESS -->

                    <div class="form-group">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                                type="email"
                                id="email"
                                th:field="*{email}"
                                class="form-control"
                                placeholder="john@example.com"
                                autocomplete="email"
                                required>

                    </div>

                    <!-- PHONE NUMBER -->

                    <div class="form-group">

                        <label for="phoneNumber" class="form-label">
                            Phone Number
                        </label>

                        <input
                                type="text"
                                id="phoneNumber"
                                th:field="*{phoneNumber}"
                                class="form-control"
                                placeholder="+1 234 567 890"
                                autocomplete="tel"
                                required>

                    </div>

                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="password" class="form-label">

                            New Password

                            <span class="optional-text">
                                Leave blank to keep current
                            </span>

                        </label>

                        <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                class="form-control"
                                placeholder="••••••••"
                                autocomplete="new-password">

                    </div>

                </div>

                <!-- DIVIDER -->

                <div class="form-divider"></div>

                <!-- ORIGINAL ACTION BUTTONS -->

                <div class="action-buttons">

                    <!-- SAVE CHANGES -->

                    <button type="submit" class="btn btn-save">

                        <i class="fa-solid fa-check me-2"></i>
                        Save Changes

                    </button>

                    <!-- CANCEL -->

                    <a th:href="@{/customer/profile}"
                       class="btn btn-cancel">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

</body>
</html>

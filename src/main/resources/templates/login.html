
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Wedding Reservation Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --gold: #d7b46a;
            --gold-light: #f0d9a6;
            --white: #fffaf1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #080807;
            color: var(--white);
        }

        /* BACKGROUND */

        .login-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
            overflow: hidden;
            isolation: isolate;
        }

        .login-page::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;

            background-image: url('/login-bg.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            animation: backgroundZoom 16s ease-in-out infinite alternate;
        }

        .login-page::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;

            background: rgba(0, 0, 0, 0.45);
        }

        @keyframes backgroundZoom {
            from {
                transform: scale(1.04);
            }

            to {
                transform: scale(1.12);
            }
        }

        /* GOLD CORNERS */

        .corner {
            position: absolute;
            width: 65px;
            height: 35px;
            pointer-events: none;
        }

        .corner-left {
            top: 20px;
            left: 30px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-right {
            top: 20px;
            right: 30px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        .corner-bottom-left {
            bottom: 20px;
            left: 30px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-bottom-right {
            bottom: 20px;
            right: 30px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        /* MAIN CONTENT */

        .login-content {
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeUp 1s ease both;
        }

        .brand-small {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .gold-line {
            width: 65px;
            height: 1px;
            background: var(--gold);
            margin: 12px auto 15px;
        }

        /* HEADING */

        .main-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 4vw, 52px);
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: 1px;
            color: var(--white);
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        .subtitle {
            font-size: 12px;
            font-weight: 300;
            line-height: 1.6;
            color: #e4d9cc;
            max-width: 420px;
            margin: 0 auto 18px;
        }

        /* LOGIN CARD */

        .login-card {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding: 20px 25px;

            background: rgba(8,8,8,0.58);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(215,180,106,0.55);

            box-shadow: 0 20px 60px rgba(0,0,0,0.30);

            text-align: left;
        }

        .login-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 23px;
            font-weight: 400;
            color: var(--white);
            margin-bottom: 17px;
        }

        /* FORM LABEL */

        .form-label {
            color: #e6dac8;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        /* INPUT FIELDS */

        .form-control {
            width: 100%;
            height: 42px;
            padding: 8px 12px;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(215,180,106,0.45);

            border-radius: 0;

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 12px;

            transition: 0.3s ease;
        }

        .form-control::placeholder {
            color: #b8ada2;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.10);
            color: white;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(215,180,106,0.12);
            outline: none;
        }

        .login-card .mb-3 {
            margin-bottom: 12px !important;
        }

        .login-card .mb-4 {
            margin-bottom: 16px !important;
        }

        /* SIGN IN BUTTON */

        .btn-wedding {
            width: 100%;
            padding: 10px 16px;

            background: transparent;

            border: 1px solid var(--gold);
            border-radius: 0;

            color: var(--gold-light);

            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;

            transition: 0.35s ease;
        }

        .btn-wedding:hover {
            background: var(--gold);
            color: #17120b;
            transform: translateY(-2px);
        }

        /* REGISTER LINK */

        .register-text {
            text-align: center;
            font-size: 11px;
            color: #e2d6c7;
            margin-top: 14px;
            margin-bottom: 0;
        }

        .register-link {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .register-link:hover {
            color: white;
            text-decoration: underline;
        }

        /* ALERTS */

        .alert {
            border-radius: 0;
            font-size: 12px;
            padding: 10px;
            text-align: center;
        }

        /* ANIMATION */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NORMAL LAPTOP */

        @media (min-width: 769px) and (max-height: 900px) {

            .login-page {
                padding: 20px;
            }

            .login-content {
                max-width: 550px;
            }

            .main-heading {
                font-size: clamp(36px, 4vw, 52px);
            }

            .login-card {
                max-width: 380px;
                padding: 20px 25px;
            }
        }

        /* SHORT LAPTOP SCREEN */

        @media (min-width: 769px) and (max-height: 650px) {

            .login-page {
                padding: 12px 16px;
            }

            .main-heading {
                font-size: 36px;
            }

            .gold-line {
                margin: 8px auto 10px;
            }

            .subtitle {
                margin-bottom: 12px;
            }

            .login-card {
                padding: 15px 22px;
            }

            .login-title {
                margin-bottom: 12px;
            }
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            .login-page {
                padding: 65px 18px;
            }

            .login-content {
                max-width: 440px;
            }

            .main-heading {
                font-size: clamp(36px, 10vw, 48px);
            }

            .subtitle {
                font-size: 12px;
                margin-bottom: 20px;
            }

            .login-card {
                max-width: 380px;
                padding: 25px 20px;
            }

            .brand-small {
                font-size: 10px;
                letter-spacing: 3px;
            }

            .corner {
                width: 35px;
                height: 25px;
            }

            .corner-left,
            .corner-bottom-left {
                left: 14px;
            }

            .corner-right,
            .corner-bottom-right {
                right: 14px;
            }

            .corner-left,
            .corner-right {
                top: 14px;
            }

            .corner-bottom-left,
            .corner-bottom-right {
                bottom: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-page::before,
            .login-content {
                animation: none;
            }
        }

    </style>
</head>

<body>

<section class="login-page">

    <!-- GOLD CORNERS -->

    <span class="corner corner-left"></span>
    <span class="corner corner-right"></span>
    <span class="corner corner-bottom-left"></span>
    <span class="corner corner-bottom-right"></span>

    <!-- MAIN CONTENT -->

    <div class="login-content">

        <div class="brand-small">
            Wedding Reservation Portal
        </div>

        <div class="gold-line"></div>

        <h1 class="main-heading">
            Forever<br>
            &amp; Always
        </h1>

        <p class="subtitle">
            A refined experience for life's most beautiful celebrations.
            Your perfect wedding journey begins here.
        </p>

        <!-- LOGIN CARD -->

        <div class="login-card">

            <h2 class="login-title">
                Welcome Back
            </h2>

            <!-- ERROR MESSAGE -->

            <div th:if="${param.error}"
                 class="alert alert-danger"
                 role="alert">

                <i class="fa-solid fa-circle-exclamation me-1"></i>
                Invalid email or password.

            </div>

            <!-- LOGOUT MESSAGE -->

            <div th:if="${param.logout}"
                 class="alert alert-info"
                 role="alert">

                <i class="fa-solid fa-circle-info me-1"></i>
                You have logged out successfully.

            </div>

            <!-- SUCCESS MESSAGE -->

            <div th:if="${param.success}"
                 class="alert alert-success"
                 role="alert">

                <i class="fa-solid fa-circle-check me-1"></i>
                Account created! Please log in.

            </div>

            <!-- ORIGINAL LOGIN FORM -->

            <form th:action="@{/login}" method="post">

                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="username" class="form-label">
                        Email Address
                    </label>

                    <input
                            type="email"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="name@example.com"
                            autocomplete="username"
                            required>

                </div>

                <!-- PASSWORD -->

                <div class="mb-4">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required>

                </div>

                <!-- ORIGINAL SIGN IN BUTTON -->

                <button type="submit" class="btn btn-wedding">

                    Sign In

                    <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>

                </button>

            </form>

            <!-- ORIGINAL REGISTER LINK -->

            <p class="register-text">

                Don't have an account?

                <a th:href="@{/register}" class="register-link">
                    Register Here
                </a>

            </p>

        </div>

    </div>

</section>

</body>
</html>

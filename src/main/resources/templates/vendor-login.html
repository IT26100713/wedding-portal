<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Login | Forever &amp; Always</title><link rel="stylesheet" th:href="@{/vendor/css/vendor-theme.css}"></head>
<body>
<!--<canvas id="hearts-canvas" aria-hidden="true"
        style="position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10;"></canvas>-->
<div class="stage">
    <img th:src="@{/vendor/img/wedding-table.jpg}" src="../static/vendor/img/wedding-table.jpg" alt="">
    <div class="stage-art" aria-hidden="true"><svg viewBox="0 0 120 160" class="orn" aria-hidden="true"><path d="M60 158C58 120 62 90 60 50"/><path d="M60 112C40 106 28 92 30 74c20 2 32 16 30 38z"/><path d="M60 92C80 86 94 72 92 54c-20 2-32 16-32 38z"/><path d="M60 50c-12-6-16-20-8-32 10 6 14 20 8 32z"/><path d="M60 50c12-6 16-20 8-32-10 6-14 20-8 32z"/><circle cx="60" cy="14" r="5"/></svg></div>
    <div class="stage-brand rise">
        <div class="logo"><svg viewBox="0 0 48 40" class="orn" aria-hidden="true"><path d="M17 34C6 26 3 19 3 14a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 5-3 12-14 20z"/><path d="M31 34C20 26 17 19 17 14a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 5-3 12-14 20z"/></svg><b>Forever<br>&amp; Always</b><small>Vendor Portal</small></div>
        <p class="tag">Where your service<br>becomes their<span class="script">forever memory.</span></p>
    </div>
    <main class="glass rise-2">
        <span class="sr-only">Vendor Login</span>
        <h1>Welcome Back</h1>
        <p class="lead">Sign in to continue to your vendor account</p>
        <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-ok" th:text="${success}"></div>
        <div th:if="${param.loggedout != null}" class="alert alert-info">You have been logged out.</div>
        <div th:if="${param.deleted != null}" class="alert alert-info">Your account has been deleted.</div>
        <form th:action="@{/vendor/login}" method="post">
            <div class="f"><label for="email">Email</label><div class="with-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input type="email" id="email" name="email" th:value="${email}" placeholder="you@business.com" autocomplete="email" required></div></div>
            <div class="f"><label for="password">Password</label><div class="with-ico pw"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" id="password" name="password" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pwToggle" aria-controls="password" aria-pressed="false" aria-label="Show password"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
            <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px">Sign in</button>
        </form>
        <p class="foot">Don't have an account? <a th:href="@{/vendor/register}">Register here</a></p>
    </main>
</div>
<script>
    (function(){var b=document.getElementById('pwToggle'),i=document.getElementById('password');if(!b||!i)return;
    b.addEventListener('click',function(){var s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-pressed',s);b.setAttribute('aria-label',s?'Hide password':'Show password');});})();
</script>
<script>
    (function () {
      'use strict';

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const canvas = document.getElementById('hearts-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      // Cursor tracking for the avoid effect
      const mouse = { x: -9999, y: -9999, radius: 130, active: false };

      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -9999;
        mouse.y = -9999;
        mouse.active = false;
      });
      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const heartColors = [
        'rgba(247, 214, 224, 0.75)', 'rgba(255, 230, 236, 0.70)',
        'rgba(238, 185, 203, 0.72)', 'rgba(255, 240, 245, 0.80)',
        'rgba(224, 158, 181, 0.65)', 'rgba(214, 108, 140, 0.60)',
        'rgba(250, 218, 221, 0.70)', 'rgba(243, 201, 210, 0.68)'
      ];

      class Heart {
        constructor() { this.init(true); }

        init(initialScatter = false) {
          this.x = Math.random() * width;
          this.y = initialScatter ? Math.random() * height : -20 - Math.random() * 50;
          this.size = 8 + Math.random() * 11;
          this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
          this.angle = (Math.random() - 0.5) * 0.8;
          this.angularSpeed = (Math.random() - 0.5) * 0.02;
          this.speedY = 0.7 + Math.random() * 1.3;
          this.speedX = (Math.random() - 0.5) * 0.6;
          this.vx = 0;
          this.vy = 0;
          this.oscillationSpeed = 0.015 + Math.random() * 0.02;
          this.oscillationAmplitude = 1 + Math.random() * 1.4;
          this.oscillationPhase = Math.random() * Math.PI * 2;
          this.tumbleSpeed = 0.02 + Math.random() * 0.02;
          this.tumblePhase = Math.random() * Math.PI * 2;
        }

        update() {
          this.oscillationPhase += this.oscillationSpeed;
          this.tumblePhase += this.tumbleSpeed;
          this.angle += this.angularSpeed;

          // Push away from cursor
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          if (mouse.active && dist < mouse.radius && dist > 0) {
            const force = (mouse.radius - dist) / mouse.radius;
            const push = force * 4.2;
            this.vx += (dx / dist) * push;
            this.vy += (dy / dist) * push * 0.8;
          }

          // Evasion momentum fades out
          this.vx *= 0.92;
          this.vy *= 0.92;

          this.x += this.speedX + Math.sin(this.oscillationPhase) * this.oscillationAmplitude + this.vx;
          this.y += this.speedY + this.vy;

          if (this.y > height + 30) this.init(false);
          if (this.x < -30) this.x = width + 20;
          else if (this.x > width + 30) this.x = -20;
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          ctx.scale(0.75 + 0.25 * Math.cos(this.tumblePhase), 1);
          ctx.fillStyle = this.color;
          ctx.beginPath();
          const s = this.size;
          ctx.moveTo(0, s * 0.4);
          ctx.bezierCurveTo(-s * 1.15, -s * 0.35, -s * 0.65, -s * 1.05, 0, -s * 0.45);
          ctx.bezierCurveTo(s * 0.65, -s * 1.05, s * 1.15, -s * 0.35, 0, s * 0.4);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      const heartCount = Math.min(Math.floor((width * height) / 26000), 55);
      const hearts = Array.from({ length: heartCount }, () => new Heart());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        hearts.forEach(h => { h.update(); h.draw(); });
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();
</script>
<script>
    /* liquid-glass highlight follows the pointer (skipped for reduced-motion users) */
    (function(){var g=document.querySelector('.glass');if(!g||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    g.addEventListener('pointermove',function(e){var r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');});
    g.addEventListener('pointerleave',function(){g.style.removeProperty('--mx');g.style.removeProperty('--my');});})();
</script>
</body></html>

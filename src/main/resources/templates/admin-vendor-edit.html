<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin | Forever &amp; Always</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main class="admin-form">
    <div class="page-eyebrow">Forever &amp; Always · Admin</div>
    <h1 class="page-title">Edit vendor account</h1>
    <p th:text="${vendor.businessName}"></p>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <form th:action="@{/admin/vendors/{id}/edit(id=${vendor.id})}" th:object="${form}" method="post">
        <div class="mb-3"><label for="businessName" class="form-label">Business name</label><input id="businessName"
                                                                                                   type="text"
                                                                                                   th:field="*{businessName}"
                                                                                                   class="form-control"
                                                                                                   required></div>
        <div class="mb-3"><label for="ownerName" class="form-label">Owner name</label><input id="ownerName" type="text"
                                                                                             th:field="*{ownerName}"
                                                                                             class="form-control"
                                                                                             required></div>
        <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" type="email"
                                                                                    th:field="*{email}"
                                                                                    class="form-control" required></div>
        <div class="mb-3"><label for="phone" class="form-label">Phone</label><input id="phone" type="text"
                                                                                    th:field="*{phone}"
                                                                                    class="form-control" required></div>
        <div class="mb-3"><label for="city" class="form-label">City</label><input id="city" type="text"
                                                                                  th:field="*{city}"
                                                                                  class="form-control" required></div>
        <div class="mb-3"><label for="baseRate" class="form-label">Base rate (LKR)</label><input id="baseRate"
                                                                                                 type="number"
                                                                                                 th:field="*{baseRate}"
                                                                                                 class="form-control"
                                                                                                 required min="0"
                                                                                                 step="0.01"></div>
        <div class="mb-3"><label for="description">Description</label><textarea id="description"
                                                                                th:field="*{description}"
                                                                                maxlength="500"
                                                                                class="form-control"></textarea></div>
        <button class="btn btn-rose">Save changes</button>
        <a th:href="@{/admin/dashboard} + '#vendors'" class="btn btn-outline-secondary rounded-pill">Cancel</a></form>
</main>
</body>
</html>

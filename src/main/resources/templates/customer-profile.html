
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Wedding Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #d7b46a;
            --gold-light: #f0d9a6;
            --white: #fffaf1;
            --muted: #d6c9b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #080807;
            color: var(--white);
            min-height: 100vh;
        }

        /* BACKGROUND */

        .page-background {
            position: fixed;
            inset: 0;
            z-index: -1;

            background:
                linear-gradient(
                    rgba(0,0,0,0.76),
                    rgba(0,0,0,0.83)
                ),
                url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;
            background-position: center;
        }

        /* NAVBAR */

        .navbar-custom {
            background: rgba(10,10,10,0.78);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(215,180,106,0.35);
            padding: 15px 35px;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--gold-light) !important;
        }

        .navbar-brand i {
            color: var(--gold);
        }

        .btn-dashboard,
        .btn-logout {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold);
            border-radius: 0;
            padding: 9px 18px;
            font-size: 12px;
            transition: 0.3s ease;
        }

        .btn-dashboard:hover,
        .btn-logout:hover {
            background: var(--gold);
            color: #17120b;
            border-color: var(--gold);
        }

        /* PAGE HEADING */

        .page-heading {
            text-align: center;
            margin: 26px 0 25px;
        }

        .small-title {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gold-line {
            width: 65px;
            height: 1px;
            background: var(--gold);
            margin: 12px auto;
        }

        .page-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 4vw, 45px);
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 0;
        }

        /* PROFILE CARD */

        .profile-container {
            max-width: 770px;
            margin: 0 auto 45px;
            padding: 0 20px;
        }

        .profile-card {
            background: rgba(8,8,8,0.68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(215,180,106,0.60);
            box-shadow: 0 20px 65px rgba(0,0,0,0.42);
            overflow: hidden;
            animation: fadeUp 0.9s ease both;
        }

        /* PROFILE HEADER */

        .profile-header {
            text-align: center;
            padding: 25px 25px 20px;

            background: linear-gradient(
                135deg,
                rgba(215,180,106,0.12),
                rgba(0,0,0,0.25)
            );

            border-bottom: 1px solid rgba(215,180,106,0.32);
        }

        .avatar-circle {
            width: 75px;
            height: 75px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 12px;

            background: rgba(215,180,106,0.10);
            color: var(--gold);
            font-size: 28px;
            box-shadow: 0 0 25px rgba(215,180,106,0.13);
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 27px;
            font-weight: 500;
            color: white;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .customer-badge {
            display: inline-block;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 5px 16px;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* PROFILE BODY */

        .profile-body {
            padding: 25px 32px 28px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: white;
            margin-bottom: 20px;
        }

        .section-title i {
            color: var(--gold);
            margin-right: 10px;
        }

        /* USER INFORMATION */

        .info-box {
            height: 100%;
            padding: 15px 18px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(215,180,106,0.28);
            transition: 0.3s ease;
        }

        .info-box:hover {
            border-color: var(--gold);
            background: rgba(215,180,106,0.08);
            transform: translateY(-2px);
        }

        .info-label {
            color: var(--gold);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .info-value {
            color: white;
            font-size: 14px;
            font-weight: 400;
            overflow-wrap: anywhere;
        }

        .info-icon {
            color: var(--gold-light);
            margin-right: 9px;
            font-size: 13px;
        }

        /* ACTION BUTTONS */

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 23px;
            padding-top: 20px;
            border-top: 1px solid rgba(215,180,106,0.28);
        }

        .btn-back {
            padding: 11px 20px;
            border: 1px solid rgba(215,180,106,0.6);
            border-radius: 0;
            color: var(--gold-light);
            background: transparent;
            font-size: 12px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(215,180,106,0.1);
            color: white;
        }

        .btn-edit {
            padding: 11px 23px;
            border: 1px solid var(--gold);
            border-radius: 0;
            background: var(--gold);
            color: #17120b;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-edit:hover {
            background: transparent;
            color: var(--gold-light);
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* SUCCESS MESSAGE */

        .alert-success {
            border-radius: 0;
            border: 1px solid #8daa89;
            background: rgba(25,75,40,0.88);
            color: white;
            font-size: 13px;
        }

        /* ANIMATION */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LAPTOP RESPONSIVE */

        @media (min-width: 769px) and (max-height: 800px) {
            .page-heading {
                margin: 18px 0;
            }

            .profile-header {
                padding: 18px 20px;
            }

            .avatar-circle {
                width: 62px;
                height: 62px;
                font-size: 24px;
            }

            .profile-name {
                font-size: 24px;
            }

            .profile-body {
                padding: 20px 28px;
            }

            .section-title {
                margin-bottom: 14px;
            }

            .info-box {
                padding: 12px 15px;
            }

            .action-buttons {
                margin-top: 17px;
                padding-top: 15px;
            }
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {
            .navbar-custom {
                padding: 13px 12px;
            }

            .navbar-brand {
                font-size: 18px;
            }

            .btn-dashboard,
            .btn-logout {
                padding: 7px 10px;
                font-size: 11px;
            }

            .page-heading h1 {
                font-size: 33px;
            }

            .profile-container {
                padding: 0 15px;
            }

            .profile-body {
                padding: 22px 18px;
            }

            .profile-name {
                font-size: 23px;
            }

            .action-buttons {
                justify-content: stretch;
            }

            .btn-back,
            .btn-edit {
                flex: 1;
                text-align: center;
                padding: 11px 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .profile-card {
                animation: none;
            }

            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="page-background"></div>

<!-- NAVBAR -->

<nav class="navbar navbar-custom">
    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/customer/dashboard}">

            <i class="fa-solid fa-rings-wedding me-2"></i>
            Forever &amp; Always

        </a>

        <div class="d-flex align-items-center gap-2">

            <!-- ORIGINAL DASHBOARD BUTTON -->

            <a th:href="@{/customer/dashboard}"
               class="btn btn-dashboard">

                <i class="fa-solid fa-arrow-left me-1"></i>
                Dashboard

            </a>

            <!-- ORIGINAL LOGOUT BUTTON -->

            <form th:action="@{/logout}"
                  method="post"
                  class="m-0">

                <button type="submit"
                        class="btn btn-logout">

                    <i class="fa-solid fa-arrow-right-from-bracket me-1"></i>
                    Logout

                </button>

            </form>

        </div>

    </div>
</nav>


<!-- PAGE HEADING -->

<div class="page-heading">

    <span class="small-title">
        Forever &amp; Always
    </span>

    <div class="gold-line"></div>

    <h1>My Profile</h1>

    <p>
        Your personal information, beautifully organized.
    </p>

</div>


<!-- PROFILE CONTENT -->

<div class="profile-container">

    <!-- ORIGINAL SUCCESS MESSAGE -->

    <div th:if="${param.updated}"
         class="alert alert-success alert-dismissible fade show mb-3"
         role="alert">

        <i class="fa-solid fa-circle-check me-2"></i>
        Profile updated successfully!

        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>

    </div>


    <!-- PROFILE CARD -->

    <div class="profile-card">

        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>

            <h3 class="profile-name"
                th:text="${user.fullName}">
                Jane Doe
            </h3>

            <span class="customer-badge">
                CUSTOMER
            </span>

        </div>


        <!-- PROFILE BODY -->

        <div class="profile-body">

            <h5 class="section-title">

                <i class="fa-regular fa-address-card"></i>
                Contact Information

            </h5>


            <!-- ORIGINAL USER DETAILS -->

            <div class="row g-3">

                <!-- FULL NAME -->

                <div class="col-md-6">

                    <div class="info-box">

                        <div class="info-label">
                            Full Name
                        </div>

                        <div class="info-value">

                            <i class="fa-regular fa-user info-icon"></i>

                            <span th:text="${user.fullName}">
                                Jane Doe
                            </span>

                        </div>

                    </div>

                </div>


                <!-- PHONE NUMBER -->

                <div class="col-md-6">

                    <div class="info-box">

                        <div class="info-label">
                            Phone Number
                        </div>

                        <div class="info-value">

                            <i class="fa-solid fa-phone info-icon"></i>

                            <span th:text="${user.phoneNumber}">
                                +1 234 567 890
                            </span>

                        </div>

                    </div>

                </div>


                <!-- EMAIL ADDRESS -->

                <div class="col-12">

                    <div class="info-box">

                        <div class="info-label">
                            Email Address
                        </div>

                        <div class="info-value">

                            <i class="fa-regular fa-envelope info-icon"></i>

                            <span th:text="${user.email}">
                                jane@example.com
                            </span>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ORIGINAL ACTION BUTTONS -->

            <div class="action-buttons">

                <!-- BACK TO DASHBOARD -->

                <a th:href="@{/customer/dashboard}"
                   class="btn btn-back">

                    Back to Dashboard

                </a>


                <!-- EDIT PROFILE -->

                <a th:href="@{/customer/profile/edit}"
                   class="btn btn-edit">

                    <i class="fa-solid fa-pen-to-square me-2"></i>
                    Edit Profile

                </a>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" th:href="@{/review/css/wedding-bootstrap.css}">
  <title>Edit your review</title>
</head>
<body data-page="edit">
<nav th:replace="~{fragments/review-nav :: nav('')}"></nav>
<main class="container py-4 py-md-5" style="max-width: 900px;">
  <div id="pageAlert"></div>
  <section class="page-hero p-4 p-md-5 mb-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h1 class="display-5 mb-1">Edit your review</h1>
      <p class="text-secondary fs-5 mb-0">Changes go back to the team for approval.</p>
    </div>
    
  </section>

  <form class="card border-0 card-accent p-4 p-md-5" id="reviewForm" style="max-width: 660px;">
    <fieldset class="mb-4">
      <legend class="fs-6 fw-semibold float-none w-auto mb-2">Your rating</legend>
      <div class="rating-stars">
          <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars">&#9733;</label>
          <input type="radio" id="star4" name="rating" value="4" required><label for="star4" title="4 stars">&#9733;</label>
          <input type="radio" id="star3" name="rating" value="3" required><label for="star3" title="3 stars">&#9733;</label>
          <input type="radio" id="star2" name="rating" value="2" required><label for="star2" title="2 stars">&#9733;</label>
          <input type="radio" id="star1" name="rating" value="1" required><label for="star1" title="1 stars">&#9733;</label>
      </div>
    </fieldset>

    <div class="mb-4">
      <label for="comment" class="form-label fw-semibold">Your review</label>
      <textarea class="form-control" id="comment" name="comment" rows="5" required minlength="10" maxlength="500" data-counter="count" placeholder="What did you like? What could be better?"></textarea>
      <div class="form-text text-end" id="count">0 / 500</div>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary px-4">Save changes</button>
      <a class="btn btn-outline-secondary" th:href="@{/review/mine}">Cancel</a>
    </div>
  </form>
</main>

<div class="modal fade" id="confirmDelete" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-4" id="confirmDeleteLabel">Delete this review?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">This cannot be undone.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="demoToast" class="toast text-bg-dark" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="demoToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/review/js/wedding-demo.js}"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Wedding Reservation Portal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #d7b46a;
            --gold-light: #f0d9a6;
            --white: #fffaf1;
            --muted: #d6c9b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #080807;
            color: var(--white);
        }

        /* LUXURY BACKGROUND */

        .register-page {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            overflow: hidden;
            isolation: isolate;
        }

        .register-page::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;

            background-image:
                url('/login-bg.avif');

            background-size: cover;
            background-position: center;

            animation: backgroundZoom 18s ease-in-out infinite alternate;
        }

        .register-page::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;

            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.65) 0%,
                rgba(0, 0, 0, 0.55) 45%,
                rgba(0, 0, 0, 0.86) 100%
            );
        }

        @keyframes backgroundZoom {
            from {
                transform: scale(1.03);
            }

            to {
                transform: scale(1.12);
            }
        }

        /* DECORATIVE GOLD CORNERS */

        .corner {
            position: absolute;
            width: 65px;
            height: 35px;
            pointer-events: none;
        }

        .corner-left {
            top: 20px;
            left: 30px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-right {
            top: 20px;
            right: 30px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        .corner-bottom-left {
            bottom: 20px;
            left: 30px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .corner-bottom-right {
            bottom: 20px;
            right: 30px;
            border-bottom: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }

        /* MAIN CONTENT */

        .register-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 620px;
            text-align: center;
            animation: fadeUp 1s ease both;
        }

        .brand-small {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .gold-line {
            width: 70px;
            height: 1px;
            background: var(--gold);
            margin: 13px auto 16px;
        }

        /* MAIN TITLE */

        .main-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(35px, 4vw, 53px);
            line-height: 1.12;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--white);
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .subtitle {
            color: #e4d9cc;
            font-size: 12px;
            font-weight: 300;
            line-height: 1.7;
            margin: 0 auto 20px;
            max-width: 460px;
        }

        /* GLASS REGISTRATION CARD */

        .register-card {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 25px 32px;

            background: rgba(8, 8, 8, 0.62);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(215, 180, 106, 0.6);

            box-shadow: 0 20px 60px rgba(0,0,0,0.35);

            text-align: left;
        }

        .card-icon {
            display: block;
            text-align: center;
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .register-title {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 400;
            text-align: center;
            color: white;
            margin-bottom: 6px;
        }

        .card-description {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            margin-bottom: 22px;
        }

        /* FORM GRID */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 17px 18px;
        }

        .form-group {
            min-width: 0;
        }

        .form-label {
            display: block;
            color: #e6dac8;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        /* INPUT FIELDS */

        .form-control {
            width: 100%;
            height: 43px;
            padding: 10px 13px;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(215,180,106,0.45);
            border-radius: 0;

            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;

            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #b8ada2;
            opacity: 1;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.11);
            color: white;
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 2px rgba(215,180,106,0.15);
        }

        /* ORIGINAL CREATE ACCOUNT BUTTON */

        .btn-wedding {
            width: 100%;
            margin-top: 23px;
            padding: 12px 18px;

            background: transparent;
            border: 1px solid var(--gold);
            border-radius: 0;

            color: var(--gold-light);
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.8px;
            text-transform: uppercase;

            cursor: pointer;
            transition: all 0.35s ease;
        }

        .btn-wedding:hover {
            background: var(--gold);
            color: #17120b;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(215,180,106,0.15);
        }

        /* SIGN IN LINK */

        .signin-text {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            margin: 18px 0 0;
        }

        .signin-link {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signin-link:hover {
            color: white;
            text-decoration: underline;
        }

        /* ERROR MESSAGE */

        .alert-danger {
            border-radius: 0;
            font-size: 12px;
            text-align: center;
            margin-bottom: 17px;
            padding: 10px;
        }

        /* ENTRANCE ANIMATION */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NORMAL LAPTOP RESPONSIVE */

        @media (min-width: 769px) and (max-height: 900px) {

            .register-page {
                padding: 20px;
            }

            .main-heading {
                font-size: clamp(35px, 4vw, 48px);
            }

            .gold-line {
                margin: 10px auto 13px;
            }

            .subtitle {
                margin-bottom: 16px;
            }

            .register-card {
                padding: 20px 28px;
            }

            .register-title {
                font-size: 23px;
            }

            .card-description {
                margin-bottom: 16px;
            }

            .form-grid {
                gap: 13px 16px;
            }

            .btn-wedding {
                margin-top: 19px;
            }
        }

        /* SMALL LAPTOP HEIGHT */

        @media (min-width: 769px) and (max-height: 650px) {

            .register-page {
                padding: 12px 20px;
            }

            .main-heading {
                font-size: 34px;
            }

            .subtitle {
                margin-bottom: 10px;
            }

            .register-card {
                padding: 14px 25px;
            }

            .card-icon {
                margin-bottom: 4px;
            }

            .card-description {
                margin-bottom: 10px;
            }

            .form-grid {
                gap: 9px 15px;
            }

            .signin-text {
                margin-top: 10px;
            }
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            .register-page {
                padding: 70px 18px;
            }

            .register-content {
                max-width: 460px;
            }

            .main-heading {
                font-size: clamp(34px, 9vw, 45px);
            }

            .subtitle {
                font-size: 12px;
            }

            .register-card {
                padding: 24px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .corner {
                width: 35px;
                height: 25px;
            }

            .corner-left,
            .corner-bottom-left {
                left: 14px;
            }

            .corner-right,
            .corner-bottom-right {
                right: 14px;
            }

            .corner-left,
            .corner-right {
                top: 14px;
            }

            .corner-bottom-left,
            .corner-bottom-right {
                bottom: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .register-page::before,
            .register-content {
                animation: none;
            }

            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

<section class="register-page">

    <!-- GOLD DECORATIVE CORNERS -->

    <span class="corner corner-left"></span>
    <span class="corner corner-right"></span>
    <span class="corner corner-bottom-left"></span>
    <span class="corner corner-bottom-right"></span>


    <!-- MAIN CONTENT -->

    <div class="register-content">

        <div class="brand-small">
            Wedding Reservation Portal
        </div>

        <div class="gold-line"></div>

        <h1 class="main-heading">
            Join Forever<br>
            &amp; Always
        </h1>

        <p class="subtitle">
            Begin your journey towards a beautiful celebration.
            Create your account and let your dream wedding come to life.
        </p>


        <!-- REGISTRATION CARD -->

        <div class="register-card">

            <i class="fa-solid fa-heart-circle-plus card-icon"></i>

            <h2 class="register-title">
                Create Your Account
            </h2>

            <p class="card-description">
                Your forever story begins here
            </p>


            <!-- ORIGINAL ERROR MESSAGE -->

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}"
                 role="alert">
            </div>


            <!-- ORIGINAL SPRING BOOT FORM -->

            <form th:action="@{/register}"
                  th:object="${user}"
                  method="post">

                <div class="form-grid">

                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName" class="form-label">
                            Full Name
                        </label>

                        <input
                                type="text"
                                id="fullName"
                                th:field="*{fullName}"
                                class="form-control"
                                placeholder="John Doe"
                                autocomplete="name"
                                required>

                    </div>


                    <!-- PHONE NUMBER -->

                    <div class="form-group">

                        <label for="phoneNumber" class="form-label">
                            Phone Number
                        </label>

                        <input
                                type="tel"
                                id="phoneNumber"
                                th:field="*{phoneNumber}"
                                class="form-control"
                                placeholder="+94 77 123 4567"
                                autocomplete="tel"
                                required>

                    </div>


                    <!-- EMAIL ADDRESS -->

                    <div class="form-group">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                                type="email"
                                id="email"
                                th:field="*{email}"
                                class="form-control"
                                placeholder="john@example.com"
                                autocomplete="email"
                                required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                class="form-control"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required>

                    </div>

                </div>


                <!-- ORIGINAL CREATE ACCOUNT BUTTON -->

                <button type="submit" class="btn btn-wedding">
                    Create Account
                </button>

            </form>


            <!-- ORIGINAL SIGN IN LINK -->

            <p class="signin-text">

                Already registered?

                <a th:href="@{/login}" class="signin-link">
                    Sign In Here
                </a>

            </p>

        </div>

    </div>

</section>

</body>
</html>

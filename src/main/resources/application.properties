spring.application.name=wedding

# MySQL connection. 127.0.0.1 is used instead of localhost (localhost did not connect on a Mac).
# createDatabaseIfNotExist=true makes the wedding_db database by itself on the first run.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/wedding_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Each team member: change this to YOUR MySQL root password
spring.datasource.password=MyPass123

# "update" lets Spring create the tables (e.g. bookings) and add missing columns. It never deletes data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
spring.thymeleaf.cache=false
spring.flyway.enabled=false

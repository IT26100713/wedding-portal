# Default application profile uses H2 for local development/testing.
# For MySQL, activate the profile 'mysql' or use the application-mysql.properties file.

spring.application.name=wedding-planning-system

# H2 in-memory database configuration for local development and tests.
spring.datasource.url=jdbc:h2:mem:weddingdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console access: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf configuration
spring.thymeleaf.cache=false

# Recommended MySQL setup (create a database manually first):
# CREATE DATABASE wedding_planning_db;
# Then run the app with: --spring.profiles.active=mysql
# Example database credentials can be supplied with environment variables:
# DB_USERNAME=root DB_PASSWORD=yourPassword
# and the Spring profile file will use them automatically.
